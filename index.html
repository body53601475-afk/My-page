<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    
    <title>Abdulrahman Dahshan</title>
    
    <meta property="og:title" content="Abdulrahman Dahshan">
    <meta property="og:description" content="أهلاً هنا تبدأ الفكرة... وهنا يتحول الإبداع إلى تجربة 🚀">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body, html { height: 100%; width: 100%; overflow-x: hidden; display: flex; justify-content: center; align-items: center; background-color: #0d1b2a; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.6)), url('bg.jpg'); 
            background-position: center center; 
            background-repeat: no-repeat; 
            background-size: cover;
            transform: scale(1.02); 
            z-index: -1;
        }

        .profile-card {
            background: transparent; padding: 15px; text-align: center;
            width: 100%; max-width: 420px; min-height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; 
            padding-top: 35px;
            padding-bottom: 25px;
            animation: fadeIn 0.8s ease-out;
        }

        h1.main-title { 
            color: #ffffff; 
            font-size: 26px; 
            font-weight: 900; 
            letter-spacing: 1px; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.8); 
            text-transform: capitalize;
        }

        .links-container { 
            display: flex; flex-direction: column; gap: 12px; width: 100%;
            margin-top: auto; 
            margin-bottom: 25px;
        }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            text-decoration: none; padding: 13px; border-radius: 12px;
            color: #ffffff; font-size: 16px; font-weight: 700;
            background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px); transition: all 0.3s ease;
            animation: pulse 3s infinite ease-in-out;
        }

        .btn:active { transform: scale(0.97); }

        p.subtitle { 
            color: #ffffff; 
            font-size: 13px; 
            font-weight: 700;
            text-shadow: 0 1px 6px rgba(0,0,0,0.9); 
        }

        .btn.clicked.whatsapp { background: #25D366; border-color: #25D366; }
        .btn.clicked.facebook { background: #1877F2; border-color: #1877F2; }
        .btn.clicked.instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); border: none; }
        .btn.clicked.tiktok { background: #000000; border-color: #000000; }
        .btn.clicked.telegram { background: #0088cc; border-color: #0088cc; }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div class="profile-card">
        <h1 class="main-title">Abdulrahman Dahshan</h1>
        
        <div class="links-container">
            <a href="https://wa.me/201033965094" target="_blank" class="btn whatsapp"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
            <a href="https://www.facebook.com/share/1GEWo7st5j/" target="_blank" class="btn facebook"><i class="fa-brands fa-facebook-f"></i> فيسبوك</a>
            <a href="https://www.instagram.com/abd.elrahmanelsayed2" target="_blank" class="btn instagram"><i class="fa-brands fa-instagram"></i> إنستغرام</a>
            <a href="https://www.tiktok.com/@abdelr6hman_dahshan" target="_blank" class="btn tiktok"><i class="fa-brands fa-tiktok"></i> تيك توك</a>
            <a href="https://t.me/+201033965094" target="_blank" class="btn telegram"><i class="fa-brands fa-telegram"></i> تيليجرام</a>
        </div>

        <p class="subtitle">فكرة بسيطة، تصميم مختلف، وتجربة لا تُنسى ✨</p>
    </div>

    <script>
        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(button => {
            button.addEventListener('click', function(e) {
                if (!this.classList.contains('clicked')) {
                    e.preventDefault(); 
                    buttons.forEach(b => b.classList.remove('clicked'));
                    this.classList.add('clicked');
                } 
            });
        });
    </script>
</body>
</html>
